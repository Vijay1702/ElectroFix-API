services:
  - type: web
    name: electrofix-api
    env: node
    region: singapore
    rootDir: ElectroFix-API
    buildCommand: chmod +x ./render-build.sh && ./render-build.sh
    startCommand: npm run migrate:deploy && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://srisenthilelectrofixin.vercel.app
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
