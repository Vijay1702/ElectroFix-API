services:
  - type: web
    name: electrofix-api
    env: node
    region: singapore
    rootDir: ElectroFix-API
    buildCommand: npm install --production=false && npm run build && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://srisenthilelectrofixin.vercel.app
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
